# configs/runs/queue.yaml
# Execution queue for training runs.
# Priority Run Order:
#   1. PT-bpe16-10m-s0   (Gate run: smoothed loss < 7.5 required)
#   2. PT-bpe16-25m-s0
#   3. PT-akshara-10m-s0
#   4. PT-akshara-25m-s0
#   5. PT-uni16-10m-s0
#   6. PT-uni16-25m-s0
#   7. PT-char-10m-s0
#   8. PT-char-25m-s0
#   9. PT-byte-10m-s0
#   10. ADAPT runs for each finished model
# All other runs remain approved: false.
# The runner stops at the 165 u ceiling from the persisted ledger and writes final_summary.json.

runs:
