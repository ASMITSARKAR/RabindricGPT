# configs/tokenizers/uni16.yaml
# SentencePiece Unigram 16k tokenizer configuration.
# Ref: 15_BUILD_DIRECTIVE.md §2; 04_TOKENIZER_PLAN.md §1, §3

id: "uni16"
name: "SentencePiece Unigram 16k"
type: "spm_unigram"
model_type: "unigram"
vocab_size: 16384
special_ids:
  pad_id: 0
  bos_id: 1
  eos_id: 2
  unk_id: 3
lossless: true
byte_fallback: true
character_coverage: 1.0
normalization_rule_name: "identity"
split_by_whitespace: true
max_window_tokens: 256     # Ref: 04_TOKENIZER_PLAN.md §5 (~256 tokens per 1024 chars)
bytes_per_token_plan: 11.2 # Ref: 04_TOKENIZER_PLAN.md §5
training_sample_chars: 500000000 # Ref: 15_BUILD_DIRECTIVE.md §3.2 (N = 5e8 chars ESTIMATE, capped at pilot)
