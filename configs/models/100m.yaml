# configs/models/100m.yaml
# Architecture config for ~100M non-embedding parameter model (conditional, Gate G5).
# Ref: 15_BUILD_DIRECTIVE.md §2; 08_COMPUTE_BUDGET.md §4; DR-3

size_id: "100m"
n_layers: 14               # Ref: 08_COMPUTE_BUDGET.md §4 (L = 14)
d_model: 768               # Ref: 08_COMPUTE_BUDGET.md §4 (d = 768)
head_dim: 64               # Ref: 15_BUILD_DIRECTIVE.md §2 (head dim = 64)
n_heads: 12                # d_model / head_dim = 768 / 64 = 12
n_kv_heads: 12             # Default = n_heads
hidden_dim: 2048           # 8 * 768 / 3 = 2048, multiple of 64 (DR-3)
max_seq_len: 3072          # Accommodates byte tokenizer window (s = 3072)
rms_norm_eps: 1.0e-5
rope_theta: 10000.0
tie_embeddings: true       # Ref: 15_BUILD_DIRECTIVE.md §2
