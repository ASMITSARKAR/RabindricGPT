# configs/models/10m.yaml
# Architecture config for ~10M non-embedding parameter model.
# Ref: 15_BUILD_DIRECTIVE.md §2; 08_COMPUTE_BUDGET.md §4; DR-3

size_id: "10m"
n_layers: 6                # Ref: 08_COMPUTE_BUDGET.md §4 (L = 6)
d_model: 384               # Ref: 08_COMPUTE_BUDGET.md §4 (d = 384)
head_dim: 64               # Ref: 15_BUILD_DIRECTIVE.md §2 (head dim = 64)
n_heads: 6                 # d_model / head_dim = 384 / 64 = 6
n_kv_heads: 6              # Default = n_heads (multi-head attention)
hidden_dim: 1024           # 8 * d / 3 = 1024, multiple of 64 (DR-3)
max_seq_len: 3072          # Accommodates byte tokenizer window (s = 3072)
rms_norm_eps: 1.0e-5
rope_theta: 10000.0
tie_embeddings: true       # Ref: 15_BUILD_DIRECTIVE.md §2
